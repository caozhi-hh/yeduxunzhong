; ==================== pytest 配置（T1-0 新增）====================
;
; 为什么需要它：预算系统 v2 的 TDD 要在「临时数据库 + 异步后端」上跑，
; 而这些测试依赖 httpx 的 ASGI 直连与 async 测试函数。默认配置下
; async def 测试会被 pytest 直接跳过（只告警不执行）——那会造成
; "测试全绿但其实一个都没跑"的假象，是本轮最需要避免的失败模式。
;
; asyncio_mode = auto：async def 测试无需逐个加 @pytest.mark.asyncio。
; 这不会削弱严格性 —— 异步断言仍然真实执行，只是省掉样板装饰器。

[pytest]
asyncio_mode = auto

; 异步夹具（如"每个测试一个干净临时库"）默认挂在 function 作用域，
; 与 pytest-asyncio 1.x 的要求显式对齐，避免隐式行为随版本漂移。
asyncio_default_fixture_loop_scope = function

; 只在本目录树下收集测试：
;   - frontend/ 下是 Node 项目（node_modules 有数万文件），绝不能被遍历
;   - .venv/ 里有第三方包自带的测试，也不该被收集
testpaths = tests

; 显式声明文件命名规则，避免将来有人把测试写成 test_*.py 之外的名字而静默不收集
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; -ra 展示跳过/失败原因汇总：宁可看到"被跳过"，也不要看不到
; --strict-markers --strict-config：防止拼错 marker/配置项却静默通过
;
; 注意：这里**刻意不设 --basetemp**。
;   原因（实测，非推测）：本项目所处开发沙箱对 pytest 内部 tmpdir 机制
;   （basetemp / tmp_path 的编号目录创建与 sessionfinish 的 cleanup_dead_symlinks）
;   会抛 PermissionError [WinError 5]，使依赖 tmp_path 的测试在 setup 阶段就 error。
;   同一个目录路径若改用 pathlib.mkdir 创建则完全正常 —— 属环境限制而非代码缺陷。
;   因此测试夹具改用 tests/conftest.py 里自建的、进程内创建并使用的临时目录，
;   不再依赖 pytest 的 tmp_path。
;
; -p no:cacheprovider：同样因沙箱限制，pytest 写 .pytest_cache 会刷
;   "could not create cache path" 告警。缓存只影响重复运行速度，关掉更干净。
addopts = -ra --strict-markers --strict-config -p no:cacheprovider

; 严格模式下未注册的自定义 marker 会直接报错，防止拼错 marker 名却无人发现
markers =
    slow: 需要真实网络或较长耗时的测试（默认不选，用 -m slow 显式运行）