edition: 3.0.0
name: yeduxunzhong-api
access: default

vars:
  region: cn-hangzhou

resources:
  api:
    component: fc3
    props:
      region: ${vars.region}
      functionName: yeduxunzhong-api
      runtime: custom-container
      code: ./
      memorySize: 512
      timeout: 120
      instanceConcurrency: 10
      customContainerConfig:
        image: "python:3.11-slim"
        command: '["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "9000"]'
        port: 9000
      environmentVariables:
        ARK_API_KEY: ${env.ARK_API_KEY}
        UNSPLASH_ACCESS_KEY: ${env.UNSPLASH_ACCESS_KEY}
        AMAP_WEB_KEY: ${env.AMAP_WEB_KEY}
      triggers:
        - triggerName: httpTrigger
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - HEAD
              - PATCH
